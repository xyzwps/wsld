# 打 tag(如 v0.0.4)即出安装包并发布 GitHub Release
# 流程:校验 tag 与 csproj <Version> 一致 -> 单元测试 -> 静默安装 Inno Setup
#       -> tools/package.ps1 出 artifacts\installer\wsld-Setup-<版本>-x64.exe(+ .sha256)
#       -> gh release create 附上两者
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      INNO_VERSION: 6.7.3
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号并校验与 csproj 一致
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $ver = $tag -replace '^v', ''
          [xml]$csproj = Get-Content src\wsld\wsld.csproj -Raw
          $src = @($csproj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ }) | Select-Object -First 1
          if ($src -ne $ver) {
            Write-Error "tag 是 $ver,但 src\wsld\wsld.csproj 的 <Version> 是 $src —— 先把版本号对齐再打 tag"
            exit 1
          }
          "VERSION=$ver" >> $env:GITHUB_ENV

      - name: 单元测试
        shell: pwsh
        run: dotnet test tests\wsld.Tests\wsld.Tests.csproj --nologo -v q

      - name: 安装 Inno Setup ${{ env.INNO_VERSION }}
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-$($env:INNO_VERSION -replace '\.','_')/innosetup-$($env:INNO_VERSION).exe" -OutFile $exe
          # /CURRENT:装到当前用户 LOCALAPPDATA,不需要管理员
          Start-Process $exe -ArgumentList '/CURRENT','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Remove-Item $exe

      - name: 打安装包
        shell: pwsh
        run: |
          $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { Write-Error '装完没找到 ISCC.exe'; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1 -Version $env:VERSION -InnoSetup $iscc

      - name: 发布 GitHub Release
        shell: pwsh
        run: |
          $setup = "artifacts\installer\wsld-Setup-$env:VERSION-x64.exe"
          $sha = (Get-Content "$setup.sha256" -First 1) -split '\s+' | Select-Object -First 1
          $tag = '${{ github.ref_name }}'
          # 同名 Release 可能已经存在(手工建的,或重跑这个 tag):有就复用,没有才建
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = @(
              '自包含安装包(含 .NET 9 与 Windows App SDK 运行时,客户机无需另装)。',
              '',
              '- 安装向导支持简体中文 / 英文,按系统界面语言自动选择,也可用 `/LANG=en` 或 `/LANG=zh` 强制指定。',
              '- 要求 Windows 10 19041 以上;管理容器需要本机已装 WSL 3(`wslc`)。',
              '- 未做代码签名,首次运行会被 SmartScreen 拦一道,核对下面 SHA256 后选择"仍要运行"。',
              '',
              "SHA256: $sha"
            ) -join "`n"
            gh release create $tag --title $tag --notes $notes
          }
          # --clobber:同名的旧附件直接覆盖,重跑不会堆出两份
          gh release upload $tag $setup "$setup.sha256" --clobber
          gh release view $tag --json assets,url | Out-Host
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 留一份 workflow artifact(Actions 页面可直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: wsld-Setup-${{ github.ref_name }}-x64
          path: artifacts/installer/wsld-Setup-*.exe*
          if-no-files-found: error
